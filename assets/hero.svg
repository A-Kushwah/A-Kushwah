<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Terminal intro for Ayush Kushwah" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="frame"><rect width="900" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <circle cx="830" cy="40" r="110" fill="#a78bfa" opacity="0.25" filter="url(#blur)"/>
    <circle cx="70" cy="290" r="110" fill="#22d3ee" opacity="0.2" filter="url(#blur)"/>
    <rect width="900" height="36" fill="#0f1730" opacity="0.8"/>
    <line x1="0" y1="36" x2="900" y2="36" stroke="#22304f"/>
    <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="18" r="6" fill="#27c93f"/>
    <text x="450" y="22" text-anchor="middle" font-size="12" fill="#64748b" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace">ayush@vit: ~/portfolio</text>
  </g>
  <rect x="1" y="1" width="898" height="298" rx="15" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="15">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
      <text x="32" y="78" xml:space="preserve"><tspan fill="#22d3ee">ayush@vit</tspan><tspan fill="#64748b">:~$ </tspan><tspan fill="#e2e8f0">whoami</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
      <text x="32" y="124" font-size="42" font-weight="700" fill="url(#accent)">Ayush Kushwah</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/>
      <text x="32" y="154" fill="#94a3b8">Full-stack developer · distributed systems · CSE @ VIT Bhopal '27</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.4s" fill="freeze"/>
      <text x="32" y="196" xml:space="preserve"><tspan fill="#22d3ee">ayush@vit</tspan><tspan fill="#64748b">:~$ </tspan><tspan fill="#e2e8f0">cat principles.txt</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.4s" fill="freeze"/>
      <text x="32" y="224" fill="#c4b5fd">› correctness under concurrency, not just the happy path</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/>
      <text x="32" y="248" fill="#c4b5fd">› measured, tested, shipped: 500 req/s at p99 12ms · 65 integration tests</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.3s" fill="freeze"/>
      <text x="32" y="280" xml:space="preserve"><tspan fill="#22d3ee">ayush@vit</tspan><tspan fill="#64748b">:~$ </tspan></text>
      <rect x="158" y="267" width="9" height="16" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
